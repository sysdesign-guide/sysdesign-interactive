<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Design Interactive Runner</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; border: 1px solid #334155; }
    pre { background: #090d16; padding: 1rem; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: 0.75rem 1.25rem; border-radius: 6px; text-decoration: none; font-weight: 600; margin-right: 0.5rem; cursor: pointer; border: none; }
    .btn-secondary { background: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h2>System Design Encyclopedia — AI Prompt Runner</h2>
    <p id="status">Загрузка контекста...</p>
    <pre id="prompt-content">...</pre>
    <div style="margin-top: 1rem;">
      <a id="gemini-btn" href="#" target="_blank" class="btn">🚀 Открыть в Google Gemini</a>
      <button id="copy-btn" class="btn btn-secondary">📋 Скопировать для Copilot / ChatGPT</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const promptPath = urlParams.get('prompt') || 'v1/prompts/ch01-3-lab.md';

    fetch(promptPath)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return res.text();
      })
      .then(text => {
        document.getElementById('status').innerText = 'Промпт успешно загружен:';
        document.getElementById('prompt-content').innerText = text;
        
        const geminiUrl = `https://gemini.google.com/app?prompt=${encodeURIComponent(text)}`;
        document.getElementById('gemini-btn').href = geminiUrl;

        document.getElementById('copy-btn').onclick = () => {
          navigator.clipboard.writeText(text);
          alert('Промпт скопирован в буфер обмена!');
        };
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Ошибка загрузки промпта. Проверьте путь к файлу.';
      });
  </script>
</body>
</html>
