<div class="card">
  <h2>System Design Encyclopedia — AI Prompt Runner</h2>
  <p id="status">Загрузка контекста...</p>
  <pre id="prompt-content">...</pre>
  
  <div style="margin-top: 1.5rem; display: flex; gap: 10px; flex-wrap: wrap;">
    <!-- Главная кнопка действия -->
    <button id="copy-btn" class="btn" style="background: #2563eb; font-size: 1.05rem;">
      📋 Скопировать промпт в буфер
    </button>
    
    <!-- Быстрые ссылки на ИИ-ассистенты -->
    <a href="https://gemini.google.com/app" target="_blank" class="btn btn-secondary">
      🚀 Открыть Google Gemini
    </a>
    <a href="https://chatgpt.com" target="_blank" class="btn btn-secondary">
      🤖 ChatGPT
    </a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const promptPath = urlParams.get('prompt') || 'v1/prompts/ch01-3-lab.md';

  fetch(promptPath)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    })
    .then(text => {
      document.getElementById('status').innerText = 'Промпт готов к запуску:';
      document.getElementById('prompt-content').innerText = text;

      // Обработчик копирования с фидбеком для пользователя
      const copyBtn = document.getElementById('copy-btn');
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          const originalText = copyBtn.innerText;
          copyBtn.innerText = '✅ Скопировано в буфер!';
          copyBtn.style.background = '#16a34a'; // зелёный цвет
          
          setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.background = '#2563eb';
          }, 2500);
        });
      };
    })
    .catch(err => {
      document.getElementById('status').innerText = 'Ошибка загрузки промпта. Проверьте путь к файлу.';
    });
</script>
